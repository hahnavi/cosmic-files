[package]
name = "cosmic-files"
version = "1.9.0"
authors = ["Jeremy Soller <jeremy@system76.com>"]
edition = "2024"
license = "GPL-3.0-only"
rust-version = "1.99"

[dependencies]
anyhow = "1"
jiff = "0.2.37"
cctk = { git = "https://github.com/hahnavi/cosmic-protocols", package = "cosmic-client-toolkit", branch = "hahnavi", optional = true }
cosmic-mime-apps = { git = "https://github.com/pop-os/cosmic-mime-apps.git", optional = true }
dirs = "7.0.0"
gio = { version = "0.22.10", optional = true }
glib = { version = "0.22.10", optional = true }
glob = "0.3"
ignore = "0.4"
image = { version = "0.25", default-features = false }
libc = "0.2.190"
log = "0.4"
mime = "0.3"
notify-debouncer-full = "0.7"
notify-rust = { version = "4.18.1", optional = true }
open = "5.4.4"
paste = "1.0"
quick-xml = { version = "0.42.0", features = ["serialize"] }
regex = "1"
rustc-hash = "2.1"
serde = { version = "1", features = ["serde_derive"] }
shlex = { version = "2.0.1" }
tempfile = "3"
tikv-jemallocator = { version = "0.7.0", optional = true }
tokio = { version = "1.53.2", features = ["process", "sync"] }
trash = "5.2.9"
url = "2.5"
walkdir = "2.5.0"
wayland-client = { version = "0.31.14", optional = true }
xdg = { version = "3.0", optional = true }
xdg-mime = { git = "https://github.com/ebassi/xdg-mime-rs" }
# Compression
bzip2 = { version = "0.6", optional = true }           #TODO: replace with pure Rust crate
flate2 = { version = "1.1", optional = true }
tar = { version = "0.4.45", optional = true }
lzma-rust2 = { version = "0.21.0", optional = true }
ordermap = { version = "1.2.2", features = ["serde"] }
# Internationalization
i18n-embed = { version = "0.16", features = [
    "fluent-system",
    "desktop-requester",
] }
i18n-embed-fl = "0.10"
rust-embed = "8"
slotmap = "1.1.1"
zip = { version = "8", optional = true }
hex = "0.4.3"
md-5 = "0.11.0"
sha2 = "0.11.0"
png = "0.18"
jxl-oxide = { version = "0.12.5", features = ["image"], optional = true }
num_cpus = "1.17.0"
filetime = "0.2"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
thiserror = "2.0.21"
atomic_float = "1.1.0"
num_enum = "0.7.6"
bstr = "1.12.1"

# Completion-based IO runtime to enable io_uring / IOCP file IO support.
[dependencies.compio]
version = "0.19.2"
default-features = false
features = ["fs", "io", "macros", "polling", "runtime"]

[dependencies.libcosmic]
git = "https://github.com/hahnavi/libcosmic.git"
branch = "hahnavi"
default-features = false
#TODO: a11y feature crashes
features = [
    "about",
    "advanced-shaping",
    "autosize",
    "multi-window",
    "tokio",
    "winit",
    "surface-message",
]

[[example]]
name = "gio-list"
required-features = ["gvfs"]

[[example]]
name = "gio-mount"
required-features = ["gvfs"]

[[example]]
name = "gvfs"
required-features = ["gvfs"]

[features]
default = [
    "archives",
    "bzip2",
    "dbus-config",
    "desktop",
    "gvfs",
    "io-uring",
    "image-common",
    "image-extended",
    "image-parallel",
    "jxl",
    "lzma-rust2",
    "notify",
    "desktop-metadata",
    "wayland",
    "wgpu",
]
archives = ["dep:flate2", "dep:tar", "dep:zip"]
dbus-config = ["libcosmic/dbus-config"]
desktop-metadata = ["dep:xdgen"]
desktop = ["libcosmic/desktop", "dep:cosmic-mime-apps", "dep:xdg"]
desktop-applet = []
gvfs = ["dep:gio", "dep:glib"]
io-uring = ["compio/io-uring"]
jxl = ["dep:jxl-oxide"]
jemalloc = ["dep:tikv-jemallocator"]
notify = ["dep:notify-rust"]
image-common = ["image/bmp", "image/gif", "image/jpeg", "image/png", "image/webp"]
image-extended = [
    "image/dds",
    "image/exr",
    "image/ff",
    "image/hdr",
    "image/ico",
    "image/pnm",
    "image/qoi",
    "image/tga",
    "image/tiff",
]
image-parallel = ["image/rayon"]
wayland = ["libcosmic/wayland", "dep:cctk", "dep:wayland-client"]
wgpu = ["libcosmic/wgpu"]
tiny-skia = ["libcosmic/tiny-skia"]

[profile.dev]
opt-level = 1

[profile.release-with-debug]
inherits = "release"
debug = true

[target.'cfg(unix)'.dependencies]
fork = "0.10.0"
uzers = "0.12.2"

[target.'cfg(target_os = "linux")'.dependencies]
procfs = "0.18"

[target.'cfg(not(unix))'.dependencies]
jiff-icu = "0.2"
icu_collator = { version = "~2.3.1", default-features = false, features = ["compiled_data"] }
icu_datetime = { version = "~2.3.0", default-features = false, features = ["compiled_data"] }
icu_locale = { version = "~2.3.1", default-features = false }
mime_guess = "2"

[build-dependencies]
xdgen = { version = "0.1", optional = true }

[dev-dependencies]
# cap-std = "3"
# cap-tempfile = "3"
fastrand = "2"
test-log = "0.2"
tokio = { version = "1", features = ["rt", "macros"] }

